services:
  # 1. Node.js Express Backend Web Service
  - type: web
    name: bca-fest-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # 2. Flutter Web Frontend Static Site
  - type: web
    name: bca-fest-frontend
    runtime: static
    staticPublishPath: ./build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
